<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NETURION — Confidential AI Agent</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>/* ────────────────────────────────────────────────────────
 * NETURION — Confidential AI Agent
 * Built on Jutis design system structure, NETURION brand accent.
 * ──────────────────────────────────────────────────────── */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap');

:root {
  /* Surfaces — deep navy from brand imagery */
  --bg-deep:        #060a14;
  --bg-main:        #0a1020;
  --bg-elev-1:      #0e1528;
  --bg-card:        #131b30;
  --bg-inset:       #0c1322;
  --border:         #1e2a45;
  --border-soft:    rgba(30, 42, 69, 0.5);

  /* Text */
  --fg-primary:     #e8eef7;
  --fg-secondary:   #93a4bf;
  --fg-muted:       rgba(147, 164, 191, 0.5);

  /* NETURION accent — cyan/electric blue (brand) */
  --accent:         #5dd9ec;
  --accent-deep:    #2bb6cf;
  --accent-light:   #8ee7f5;
  --accent-10:      rgba(93, 217, 236, 0.10);
  --accent-20:      rgba(93, 217, 236, 0.20);
  --accent-30:      rgba(93, 217, 236, 0.30);
  --accent-50:      rgba(93, 217, 236, 0.50);
  --accent-glow:    rgba(93, 217, 236, 0.20);

  /* Semantic */
  --success:        #4ade80;
  --success-bg:     rgba(74, 222, 128, 0.10);
  --danger:         #f87171;
  --warning:        #f59e0b;
  --info:           #4a9eff;

  /* Type */
  --font-sans:      "Inter", system-ui, sans-serif;
  --font-display:   "Plus Jakarta Sans", "Inter", sans-serif;
  --font-mono:      "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-icon:      "Material Symbols Outlined";

  --tracking-wide:   0.15em;
  --tracking-wider:  0.20em;
  --tracking-widest: 0.25em;
  --tracking-tight: -0.02em;

  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 9999px;

  --shadow-cyber:       0 0 40px rgba(139, 92, 246, 0.10), 0 0 90px rgba(139, 92, 246, 0.05);
  --shadow-cyber-hover: 0 0 55px rgba(139, 92, 246, 0.18);
  --shadow-cta-glow:    0 0 28px rgba(139, 92, 246, 0.32);

  --ease-out:    cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 200ms;
  --dur-base: 320ms;
  --dur-slow: 600ms;
}

* { box-sizing: border-box; }

html, body, #root {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-deep);
  color: var(--fg-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
button:disabled { cursor: not-allowed; }

input, textarea {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
  color: inherit;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #353a47; }

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  vertical-align: middle;
}

/* ───────── App shell ───────── */
.app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: 240px 1fr 320px;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "topbar  topbar  topbar"
    "rail    main    privacy";
  background: var(--bg-deep);
  isolation: isolate;
}

.app.no-rail {
  grid-template-columns: 1fr 320px;
  grid-template-areas:
    "topbar  topbar"
    "main    privacy";
}
.app.no-privacy {
  grid-template-columns: 240px 1fr;
  grid-template-areas:
    "topbar  topbar"
    "rail    main";
}
.app.no-rail.no-privacy {
  grid-template-columns: 1fr;
  grid-template-areas:
    "topbar"
    "main";
}

/* ───────── Backdrop atmosphere ───────── */
.atmosphere {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.dotgrid {
  position: absolute; inset: 0;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.35;
  mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.55;
}
.orb-1 {
  width: 580px; height: 580px;
  left: -140px; top: -100px;
  background: var(--accent-deep);
  opacity: 0.22;
}
.orb-2 {
  width: 520px; height: 520px;
  right: -140px; bottom: -120px;
  background: #1d4ed8;
  opacity: 0.18;
}
.orb-3 {
  width: 380px; height: 380px;
  right: 30%; top: 35%;
  background: var(--accent-light);
  opacity: 0.08;
}

/* Constellation network — matches brand imagery */
.constellation {
  position: absolute;
  inset: 0;
  opacity: 0.55;
  pointer-events: none;
}
.constellation svg { width: 100%; height: 100%; display: block; }
.constellation .c-node {
  fill: var(--accent-light);
  opacity: 0.8;
  animation: c-twinkle 4s ease-in-out infinite;
}
.constellation .c-line {
  stroke: var(--accent);
  stroke-width: 0.5;
  opacity: 0.35;
}
@keyframes c-twinkle {
  0%, 100% { opacity: 0.4; }
  50%      { opacity: 1;   }
}

/* Custom NETURION wordmark (mimics the brand logo with crosshair O) */
.wordmark {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, #b8dde8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: inline-flex;
  align-items: center;
  gap: 0.06em;
  line-height: 1;
}
.wordmark .target {
  display: inline-grid;
  place-items: center;
  width: 0.62em;
  height: 0.62em;
  border: 0.05em solid var(--accent-light);
  border-radius: 50%;
  -webkit-text-fill-color: initial;
  color: var(--accent-light);
  position: relative;
  margin: 0 0.04em;
  box-shadow: 0 0 12px rgba(93, 217, 236, 0.5);
}
.wordmark .target::before,
.wordmark .target::after {
  content: "";
  position: absolute;
  background: currentColor;
}
.wordmark .target::before { width: 0.06em; height: 0.28em; }
.wordmark .target::after  { height: 0.06em; width: 0.28em; }

/* Floating geometric shapes */
.shape {
  position: absolute;
  border: 1px solid rgba(139, 92, 246, 0.18);
  border-radius: 12px;
  opacity: 0.7;
}
.shape-1 { width: 120px; height: 120px; top: 12%; right: 18%; transform: rotate(28deg); animation: float-a 14s ease-in-out infinite; }
.shape-2 { width: 80px;  height: 80px;  bottom: 18%; left: 22%; transform: rotate(-18deg); animation: float-b 11s ease-in-out infinite; }
.shape-3 { width: 200px; height: 200px; bottom: -40px; right: 36%; transform: rotate(36deg); border-color: rgba(230,232,236,0.06); animation: float-a 18s ease-in-out infinite; }

@keyframes float-a {
  0%,100% { transform: translateY(0) rotate(28deg); }
  50%     { transform: translateY(-22px) rotate(32deg); }
}
@keyframes float-b {
  0%,100% { transform: translateY(0) rotate(-18deg); }
  50%     { transform: translateY(18px) rotate(-22deg); }
}

/* top accent bar */
.top-accent-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-30), transparent);
  z-index: 10;
  pointer-events: none;
}

/* ───────── Top bar ───────── */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(20px);
  position: relative;
  z-index: 5;
}
.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand-mark {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  position: relative;
}
.brand-mark svg { width: 100%; height: 100%; }
.brand-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: var(--tracking-wider);
  color: var(--fg-primary);
}
.beta-pill {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: var(--tracking-widest);
  color: var(--accent-light);
  background: var(--accent-10);
  border: 1px solid var(--accent-30);
  padding: 3px 8px;
  border-radius: var(--r-pill);
  text-transform: uppercase;
}

.topbar-center {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  color: var(--fg-secondary);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  font-weight: 600;
}
.topbar-center .dot {
  width: 4px; height: 4px;
  background: var(--border); border-radius: 50%;
}

.topbar-right {
  display: flex; align-items: center; gap: 12px;
}

.node-status {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  font-size: 11px;
  color: var(--fg-secondary);
  letter-spacing: 0.04em;
}
.node-status .dot {
  width: 6px; height: 6px;
  background: var(--success);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(74,222,128,0.15);
  animation: pulse-dot 2s ease-in-out infinite;
}
.node-status.offline .dot {
  background: var(--danger);
  box-shadow: 0 0 0 4px rgba(248,113,113,0.15);
}
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 4px rgba(74,222,128,0.15); }
  50%      { box-shadow: 0 0 0 6px rgba(74,222,128,0.05); }
}

.wallet-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.wallet-pill:hover { border-color: var(--accent-30); }
.wallet-pill .avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  position: relative;
  overflow: hidden;
}
.wallet-pill .avatar::after {
  content:""; position:absolute; inset:0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%);
}
.wallet-pill .addr {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-primary);
}
.wallet-pill .chev { font-size: 16px; color: var(--fg-secondary); margin-left: -2px; }

.connect-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: var(--accent);
  color: #0f0719;
  border-radius: var(--r-pill);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  transition: all var(--dur-fast) var(--ease-out);
  box-shadow: var(--shadow-cta-glow);
}
.connect-btn:hover { background: var(--accent-light); transform: translateY(-1px); }
.connect-btn:active { transform: scale(0.97); }
.connect-btn .material-symbols-outlined { font-size: 18px; }

/* ───────── Left rail (sessions) ───────── */
.rail {
  grid-area: rail;
  background: rgba(20, 22, 28, 0.7);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: relative;
  z-index: 4;
}

.rail-section {
  padding: 16px 14px 8px;
}
.rail-eyebrow {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: var(--tracking-widest);
  color: var(--fg-secondary);
  text-transform: uppercase;
  padding: 0 6px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.rail-eyebrow .new-btn {
  display: grid; place-items: center;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent-10);
  color: var(--accent-light);
  transition: all var(--dur-fast) var(--ease-out);
}
.rail-eyebrow .new-btn:hover { background: var(--accent-20); }
.rail-eyebrow .new-btn .material-symbols-outlined { font-size: 16px; }

.session-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
  position: relative;
}
.session-row:hover { background: var(--bg-card); }
.session-row.active {
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.session-row.active::before {
  content:""; position:absolute;
  left: -1px; top: 12px; bottom: 12px;
  width: 2px; background: var(--accent);
  border-radius: 2px;
}
.session-icon {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  background: var(--bg-inset);
  border-radius: 7px;
  flex-shrink: 0;
}
.session-icon .material-symbols-outlined { font-size: 15px; color: var(--accent-light); }
.session-text {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.session-title {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-meta {
  font-size: 10px;
  color: var(--fg-secondary);
  display: flex; align-items: center; gap: 6px;
}
.session-meta .lock { font-size: 11px; color: var(--accent-light); }

.rail-footer {
  margin-top: auto;
  padding: 14px;
  border-top: 1px solid var(--border);
}
.encryption-tile {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative;
  overflow: hidden;
}
.encryption-tile::before {
  content:""; position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 100% 0%, var(--accent-10), transparent 70%);
  pointer-events: none;
}
.encryption-tile .row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-secondary);
}
.encryption-tile .row .val {
  color: var(--accent-light);
  font-weight: 600;
}

/* ───────── Main content area ───────── */
.main {
  grid-area: main;
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  z-index: 3;
}

/* ── Hero state (pre-connect or empty) ── */
.hero {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
  position: relative;
  text-align: center;
}

.hero-mark-wrap {
  position: relative;
  width: 200px; height: 200px;
  margin-bottom: 36px;
  display: grid; place-items: center;
}
.hero-mark-wrap .ring {
  position: absolute;
  border: 1px solid var(--accent-30);
  border-radius: 50%;
}
.hero-mark-wrap .ring-1 { width: 160px; height: 160px; animation: ring-pulse 3.5s ease-in-out infinite; }
.hero-mark-wrap .ring-2 { width: 200px; height: 200px; opacity: 0.5; animation: ring-pulse 3.5s ease-in-out infinite 0.7s; }
@keyframes ring-pulse {
  0% { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.15); opacity: 0; }
}

.hero-mark {
  width: 96px; height: 96px;
  animation: floating 6s ease-in-out infinite;
  filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.45));
}
@keyframes floating {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

.hero-wordmark {
  font-size: clamp(36px, 5vw, 64px);
  margin: 0 0 24px;
  filter: drop-shadow(0 0 28px rgba(93, 217, 236, 0.35));
  animation: word-in 800ms var(--ease-out) both;
}
@keyframes word-in {
  from { opacity: 0; letter-spacing: 0.3em; }
  to   { opacity: 1; letter-spacing: 0.18em; }
}

.hero-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: var(--tracking-widest);
  color: var(--accent-light);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  background: var(--accent-10);
  border: 1px solid var(--accent-20);
  border-radius: var(--r-pill);
}
.hero-eyebrow .dot { width:5px; height:5px; background: var(--accent); border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite; }

.hero-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(32px, 4.5vw, 52px);
  line-height: 1.08;
  letter-spacing: var(--tracking-tight);
  margin: 0 0 18px;
  max-width: 760px;
  color: var(--fg-primary);
  text-wrap: balance;
}
.hero-title .accent {
  background: linear-gradient(120deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-sub {
  font-size: 15px;
  color: var(--fg-secondary);
  max-width: 560px;
  margin: 0 0 36px;
  line-height: 1.65;
  text-wrap: pretty;
}

.hero-cta-row {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 44px;
}

.btn-primary {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 22px;
  background: var(--accent);
  color: #0f0719;
  border-radius: var(--r-pill);
  font-weight: 600;
  font-size: 14px;
  transition: all var(--dur-base) var(--ease-out);
  box-shadow: var(--shadow-cta-glow);
}
.btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 0 40px rgba(139,92,246,0.45); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary .material-symbols-outlined { font-size: 18px; }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 22px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-primary);
  border-radius: var(--r-pill);
  font-weight: 500;
  font-size: 14px;
  transition: all var(--dur-fast) var(--ease-out);
}
.btn-secondary:hover { border-color: var(--accent-30); background: var(--bg-elev-1); }
.btn-secondary .material-symbols-outlined { font-size: 18px; }

/* hero stats / proof strip */
.proof-strip {
  display: flex; gap: 24px;
  padding: 16px 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
}
.proof-strip .item {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px;
  color: var(--fg-secondary);
  white-space: nowrap;
}
.proof-strip .item .material-symbols-outlined { font-size: 16px; color: var(--accent-light); }
.proof-strip .divider {
  width: 1px; background: var(--border);
}

/* suggestion chips (empty chat) */
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 280px));
  gap: 12px;
  margin-top: 8px;
}
.suggestion {
  text-align: left;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  display: flex; flex-direction: column; gap: 4px;
  transition: all var(--dur-fast) var(--ease-out);
}
.suggestion:hover {
  border-color: var(--accent-30);
  background: var(--bg-elev-1);
  transform: translateY(-2px);
}
.suggestion .label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  color: var(--accent-light);
  text-transform: uppercase;
}
.suggestion .text {
  font-size: 13.5px;
  color: var(--fg-primary);
  font-weight: 500;
}

/* ── Chat state ── */
.chat-view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(20, 22, 28, 0.5);
  backdrop-filter: blur(20px);
}
.chat-title {
  display: flex; align-items: center; gap: 12px;
}
.chat-title .icon-box {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.chat-title .icon-box .material-symbols-outlined { font-size: 18px; color: var(--accent-light); }
.chat-title .text { display: flex; flex-direction: column; gap: 2px; }
.chat-title .name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  color: var(--fg-primary);
}
.chat-title .meta {
  font-size: 10.5px;
  color: var(--fg-secondary);
  display: flex; align-items: center; gap: 6px;
}
.chat-title .meta .dot { width: 3px; height: 3px; background: var(--border); border-radius: 50%; }

.chat-actions {
  display: flex; gap: 6px;
}
.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--fg-secondary);
  transition: all var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { background: var(--bg-card); color: var(--fg-primary); }
.icon-btn .material-symbols-outlined { font-size: 18px; }

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: relative;
  min-height: 0;
}

.msg {
  display: flex; gap: 12px;
  max-width: 720px;
  animation: msg-in 380ms var(--ease-out) both;
}
.msg.assistant { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.msg-avatar {
  width: 30px; height: 30px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
}
.msg.assistant .msg-avatar {
  background: var(--accent-10);
  border: 1px solid var(--accent-20);
}
.msg.assistant .msg-avatar svg { width: 18px; height: 18px; }
.msg.user .msg-avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  font-weight: 600;
  font-size: 11px;
}

.msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user .msg-body { align-items: flex-end; }

.msg-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px;
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  font-weight: 700;
  color: var(--fg-secondary);
}
.msg.assistant .msg-header .who { color: var(--accent-light); }
.msg.user .msg-header { flex-direction: row-reverse; }
.msg-header .lock-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  background: var(--accent-10);
  border: 1px solid var(--accent-20);
  border-radius: var(--r-pill);
  font-size: 9px;
  color: var(--accent-light);
}
.msg-header .lock-tag .material-symbols-outlined { font-size: 11px; }
.msg-header .ts {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: none;
  letter-spacing: 0;
  color: var(--fg-muted);
  font-weight: 400;
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: var(--r-lg);
  font-size: 14px;
  line-height: 1.65;
  color: var(--fg-primary);
  white-space: pre-wrap;
  word-wrap: break-word;
  position: relative;
}
.msg.assistant .msg-bubble {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top-left-radius: 6px;
}
.msg.user .msg-bubble {
  background: linear-gradient(180deg, rgba(139,92,246,0.16), rgba(139,92,246,0.10));
  border: 1px solid var(--accent-30);
  border-top-right-radius: 6px;
}

.msg-bubble code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 5px;
}

.msg-actions {
  display: flex; gap: 4px; opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-out);
}
.msg:hover .msg-actions { opacity: 1; }
.msg-actions .icon-btn { width: 24px; height: 24px; }
.msg-actions .icon-btn .material-symbols-outlined { font-size: 14px; }

/* typing indicator */
.typing-bubble {
  display: inline-flex; gap: 5px; padding: 16px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  border-top-left-radius: 6px;
}
.typing-bubble span {
  width: 7px; height: 7px;
  background: var(--accent-light);
  border-radius: 50%;
  animation: typing 1.2s ease-in-out infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
@keyframes typing {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* encryption transit visual */
.transit {
  align-self: flex-end;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--accent-10);
  border: 1px solid var(--accent-20);
  border-radius: var(--r-pill);
  font-size: 11px;
  color: var(--accent-light);
  font-family: var(--font-mono);
  animation: msg-in 280ms var(--ease-out) both;
}
.transit .stream {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 30% 100%;
  background-repeat: no-repeat;
  animation: stream 1s linear infinite;
}
@keyframes stream {
  0% { background-position: -30% 0; }
  100% { background-position: 130% 0; }
}

/* ───────── Composer ───────── */
.composer-wrap {
  flex-shrink: 0;
  padding: 12px 28px 20px;
  background: var(--bg-deep);
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 2;
}

.composer {
  display: flex; flex-direction: column;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  transition: all var(--dur-fast) var(--ease-out);
  overflow: hidden;
  position: relative;
}
.composer:focus-within {
  border-color: var(--accent-30);
  box-shadow: 0 0 0 4px var(--accent-10), 0 0 30px var(--accent-glow);
}

.composer-input {
  width: 100%;
  background: transparent;
  padding: 14px 18px 4px;
  font-size: 14px;
  color: var(--fg-primary);
  resize: none;
  max-height: 180px;
  line-height: 1.55;
}
.composer-input::placeholder { color: var(--fg-muted); }

.composer-bar {
  display: flex; align-items: center;
  padding: 8px 8px 8px 12px;
  gap: 4px;
}
.composer-bar .tools {
  display: flex; gap: 2px;
}
.composer-bar .pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  font-size: 10.5px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  color: var(--fg-secondary);
  margin-left: 8px;
  letter-spacing: 0.02em;
}
.composer-bar .pill .material-symbols-outlined { font-size: 12px; color: var(--accent-light); }

.composer-bar .spacer { flex: 1; }

.send-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--accent);
  color: #0f0719;
  border-radius: var(--r-md);
  transition: all var(--dur-fast) var(--ease-out);
}
.send-btn:hover:not(:disabled) { background: var(--accent-light); }
.send-btn:disabled { background: var(--bg-inset); color: var(--fg-muted); box-shadow: none; }
.send-btn:not(:disabled) { box-shadow: 0 0 18px rgba(139,92,246,0.4); }
.send-btn .material-symbols-outlined { font-size: 18px; }

.composer-footer {
  margin-top: 8px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10.5px;
  color: var(--fg-muted);
}
.composer-footer .kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}

/* ───────── Right privacy panel ───────── */
.privacy {
  grid-area: privacy;
  background: rgba(20, 22, 28, 0.5);
  backdrop-filter: blur(20px);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  gap: 14px;
  padding: 16px;
  position: relative;
  z-index: 4;
  overflow-y: auto;
}

.priv-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
  overflow: hidden;
}
.priv-card.glow {
  background: linear-gradient(180deg, var(--bg-elev-1), var(--bg-card));
  border-color: var(--accent-20);
  box-shadow: var(--shadow-cyber);
}
.priv-card .head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--fg-secondary);
}
.priv-card .head .live {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--success);
  font-size: 9px;
}
.priv-card .head .live .dot { width: 5px; height: 5px; background: var(--success); border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite; }

/* encryption flow diagram */
.flow-diagram {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 4px;
}
.flow-step {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  position: relative;
  transition: all var(--dur-base) var(--ease-out);
}
.flow-step.active {
  border-color: var(--accent-30);
  background: var(--accent-10);
  box-shadow: 0 0 18px var(--accent-glow);
}
.flow-step.done {
  border-color: rgba(74,222,128,0.25);
}
.flow-step.done .flow-icon {
  color: var(--success);
  background: rgba(74,222,128,0.10);
}
.flow-step .flow-icon {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  background: var(--bg-card);
  border-radius: 7px;
  color: var(--accent-light);
  flex-shrink: 0;
}
.flow-step .flow-icon .material-symbols-outlined { font-size: 15px; }
.flow-step .flow-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.flow-step .flow-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-primary);
}
.flow-step .flow-sub {
  font-size: 10px;
  color: var(--fg-secondary);
  font-family: var(--font-mono);
}
.flow-step.active .flow-label { color: var(--accent-light); }

.flow-connector {
  height: 10px;
  margin-left: 22px;
  border-left: 1px dashed var(--border);
}

/* node card */
.node-card {
  display: flex; flex-direction: column; gap: 10px;
}
.node-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px;
}
.node-row .k {
  color: var(--fg-secondary);
  letter-spacing: 0.02em;
}
.node-row .v {
  color: var(--fg-primary);
  font-family: var(--font-mono);
  font-size: 11.5px;
  display: inline-flex; align-items: center; gap: 6px;
}
.node-row .v.accent { color: var(--accent-light); }
.node-row .v.success { color: var(--success); }
.node-row .v .micro-dot {
  width: 5px; height: 5px; background: currentColor; border-radius: 50%;
}

.entropy-bar {
  height: 4px; background: var(--bg-inset); border-radius: 2px; overflow: hidden;
  position: relative;
}
.entropy-bar::after {
  content:""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  width: 35%;
  animation: entropy 2.4s linear infinite;
}
@keyframes entropy {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(380%); }
}

.session-keys {
  background: var(--bg-inset);
  border-radius: var(--r-sm);
  padding: 10px;
  display: flex; flex-direction: column; gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.session-keys .row { display: flex; align-items: center; gap: 8px; color: var(--fg-secondary); }
.session-keys .row .label { color: var(--fg-muted); width: 30px; }
.session-keys .row .val { color: var(--fg-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.session-keys .row .copy { color: var(--fg-secondary); }
.session-keys .row .copy .material-symbols-outlined { font-size: 12px; }

/* ───────── Modal (wallet connect) ───────── */
.modal-scrim {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.75);
  backdrop-filter: blur(8px);
  z-index: 50;
  display: grid; place-items: center;
  padding: 24px;
  animation: scrim-in 200ms var(--ease-out);
}
@keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 100%; max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px var(--accent-glow);
  animation: modal-in 320ms var(--ease-spring);
}
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.92) translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.modal-head {
  padding: 22px 24px 16px;
  display: flex; flex-direction: column; gap: 12px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.modal-head .close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--fg-secondary);
}
.modal-head .close:hover { background: var(--bg-inset); color: var(--fg-primary); }

.modal-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--accent-light);
}
.modal-eyebrow .material-symbols-outlined { font-size: 12px; }

.modal-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  color: var(--fg-primary);
  margin: 0;
}
.modal-sub {
  font-size: 13px;
  color: var(--fg-secondary);
  line-height: 1.55;
  margin: 0;
}

.modal-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; }

.wallet-option {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: all var(--dur-fast) var(--ease-out);
  text-align: left;
  width: 100%;
}
.wallet-option:hover { border-color: var(--accent-30); background: var(--bg-card); }
.wallet-option.connecting {
  border-color: var(--accent-30);
  background: var(--accent-10);
}
.wallet-option .logo {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--bg-card);
  border-radius: 8px;
  flex-shrink: 0;
  font-size: 16px;
  font-weight: 700;
}
.wallet-option .text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.wallet-option .name { font-size: 13.5px; font-weight: 600; color: var(--fg-primary); }
.wallet-option .meta { font-size: 11px; color: var(--fg-secondary); }
.wallet-option .status { font-size: 11px; color: var(--accent-light); font-family: var(--font-mono); }

.modal-footer {
  padding: 14px 18px;
  background: var(--bg-inset);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  font-size: 11px;
  color: var(--fg-secondary);
  line-height: 1.5;
}
.modal-footer .material-symbols-outlined { font-size: 14px; color: var(--accent-light); flex-shrink: 0; }

/* spinner */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--accent-30);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* keyboard kbd */
kbd, .kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--fg-secondary);
}

/* scanline for chat */
.scanline {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(180deg, transparent, var(--accent-30), transparent);
  pointer-events: none;
  z-index: 1;
  opacity: 0.6;
  animation: scan 6s linear infinite;
}
@keyframes scan {
  0%   { top: 0; opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.5; }
  100% { top: 100%; opacity: 0; }
}

/* responsive shrink */
@media (max-width: 1180px) {
  .app { grid-template-columns: 0 1fr 320px; }
  .rail { display: none; }
}
@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
  .privacy { display: none; }
}

@media (max-width: 768px) {
  .app {
    grid-template-columns: 1fr !important;
    grid-template-rows: 56px 1fr !important;
    grid-template-areas: "topbar" "main" !important;
  }
  .rail { display: none !important; }
  .privacy { display: none !important; }
  .topbar-center { display: none !important; }
  .chat-scroll { padding: 16px 16px; }
  .composer-wrap { padding: 8px 16px 16px; }
  .msg { max-width: 90%; }
  .hero { padding: 20px 16px; }
  .hero-title { font-size: 24px !important; }
  .hero-sub { font-size: 13px; }
  .proof-strip { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
  .suggestions { grid-template-columns: 1fr !important; }
  .btn-primary, .btn-secondary { padding: 10px 16px; font-size: 13px; }
}
</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ──────────────────────────────────────────────
 * Constellation — network of nodes + lines, brand imagery
 * ────────────────────────────────────────────── */
function Constellation() {
  // Deterministically lay out nodes on a 100x60 canvas
  const nodes = useMemo(() => {
    const seed = 42;
    const rand = (i) => {
      const x = Math.sin(seed + i * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    };
    const arr = [];
    for (let i = 0; i < 38; i++) {
      arr.push({
        x: rand(i) * 100,
        y: rand(i + 100) * 60,
        r: 0.4 + rand(i + 200) * 0.7,
        delay: rand(i + 300) * 4,
      });
    }
    return arr;
  }, []);

  const links = useMemo(() => {
    const out = [];
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 14) out.push({ a: i, b: j, d });
      }
    }
    return out;
  }, [nodes]);

  return (
    <div className="constellation">
      <svg viewBox="0 0 100 60" preserveAspectRatio="none">
        {links.map((l, i) => (
          <line
            key={i}
            className="c-line"
            x1={nodes[l.a].x} y1={nodes[l.a].y}
            x2={nodes[l.b].x} y2={nodes[l.b].y}
            style={{ opacity: Math.max(0.08, 0.45 - l.d/30) }}
          />
        ))}
        {nodes.map((n, i) => (
          <circle
            key={i}
            className="c-node"
            cx={n.x} cy={n.y} r={n.r}
            style={{ animationDelay: n.delay + 's' }}
          />
        ))}
      </svg>
    </div>
  );
}

/* Naive markdown-ish renderer — bold + inline code + bullets */
function renderContent(text) {
  const lines = text.split('\n');
  return lines.map((line, i) => {
    // code fence handling — simplified: stand-alone language-tagged fence becomes a code block start
    if (line.startsWith('```')) return null; // skip fences
    // bullet
    if (/^[•\-\*]\s/.test(line)) {
      return <div key={i} style={{ display:'flex', gap:8, marginLeft:4 }}>
        <span style={{ color:'var(--accent-light)' }}>•</span>
        <span>{inlineFormat(line.replace(/^[•\-\*]\s/, ''))}</span>
      </div>;
    }
    if (/^\d+\.\s/.test(line)) {
      const m = line.match(/^(\d+)\.\s(.*)/);
      return <div key={i} style={{ display:'flex', gap:8 }}>
        <span style={{ color:'var(--accent-light)', fontFamily:'var(--font-mono)', fontSize:12 }}>{m[1]}.</span>
        <span>{inlineFormat(m[2])}</span>
      </div>;
    }
    if (line.trim() === '') return <div key={i} style={{ height: 8 }} />;
    // code block content (lines that look like solidity)
    if (/^\s{0,4}(function|require|uint|address|contract)/.test(line)) {
      return <pre key={i} style={{
        background:'var(--bg-inset)', border:'1px solid var(--border)',
        borderRadius:6, padding:'8px 12px', margin:'2px 0',
        fontFamily:'var(--font-mono)', fontSize:12.5, color:'var(--fg-primary)',
        overflowX:'auto'
      }}>{line}</pre>;
    }
    return <div key={i}>{inlineFormat(line)}</div>;
  });
}

function inlineFormat(text) {
  // **bold** and `code`
  const parts = [];
  let rest = text;
  let key = 0;
  while (rest.length) {
    const boldM = rest.match(/^\*\*(.+?)\*\*/);
    const codeM = rest.match(/^`(.+?)`/);
    if (boldM) {
      parts.push(<strong key={key++} style={{ color: 'var(--fg-primary)', fontWeight: 600 }}>{boldM[1]}</strong>);
      rest = rest.slice(boldM[0].length);
    } else if (codeM) {
      parts.push(<code key={key++}>{codeM[1]}</code>);
      rest = rest.slice(codeM[0].length);
    } else {
      // take chars until next special
      const idx = rest.search(/(\*\*|`)/);
      if (idx === -1) { parts.push(<span key={key++}>{rest}</span>); rest = ''; }
      else { parts.push(<span key={key++}>{rest.slice(0, idx)}</span>); rest = rest.slice(idx); }
    }
  }
  return parts;
}

/* Transit / ciphertext indicator */
function TransitIndicator({ direction }) {
  const [chunk, setChunk] = useState(ciphertextChunk(28));
  useEffect(() => {
    const id = setInterval(() => setChunk(ciphertextChunk(28)), 120);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="transit">
      <span className="material-symbols-outlined" style={{ fontSize: 13 }}>
        {direction === 'up' ? 'arrow_upward' : 'arrow_downward'}
      </span>
      <span>{direction === 'up' ? 'Encrypting' : 'Decrypting'}</span>
      <span style={{ opacity: 0.7 }}>{chunk}</span>
      <span className="stream"></span>
    </div>
  );
}

/* Composer */
function Composer({ value, onChange, onSend, disabled, ready }) {
  const ref = useRef(null);

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      onSend();
    }
  }

  useEffect(() => {
    if (ref.current) {
      ref.current.style.height = 'auto';
      ref.current.style.height = Math.min(180, ref.current.scrollHeight) + 'px';
    }
  }, [value]);

  return (
    <div className="composer-wrap">
      <div className="composer">
        <textarea
          ref={ref}
          className="composer-input"
          rows={1}
          value={value}
          onChange={e => onChange(e.target.value)}
          onKeyDown={handleKey}
          placeholder={ready ? 'Type a confidential prompt — it will be encrypted before leaving your device…' : 'Connect a wallet to start an encrypted session'}
          disabled={!ready || disabled}
        />
        <div className="composer-bar">
          <div className="tools">
            <button className="icon-btn" title="Attach (encrypted)"><span className="material-symbols-outlined">attach_file</span></button>
            <button className="icon-btn" title="Voice"><span className="material-symbols-outlined">mic</span></button>
            <button className="icon-btn" title="Prompt library"><span className="material-symbols-outlined">bookmarks</span></button>
          </div>
          <div className="pill">
            <span className="material-symbols-outlined">lock</span>
            E2E · IBE + HE
          </div>
          <div className="pill" style={{ marginLeft: 4 }}>
            <span className="material-symbols-outlined">memory</span>
            Llama 3.1
          </div>
          <span className="spacer"></span>
          <button
            className="send-btn"
            onClick={onSend}
            disabled={!ready || disabled || !value.trim()}
            title="Send (Enter)"
          >
            <span className="material-symbols-outlined">arrow_upward</span>
          </button>
        </div>
      </div>
      <div className="composer-footer">
        <span>
          <span className="material-symbols-outlined" style={{ fontSize:12, verticalAlign:'-2px', color:'var(--accent-light)' }}>shield</span>
          {' '}NETURION never sees plaintext. Decryption happens locally with your wallet's session key.
        </span>
        <span>
          <kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline
        </span>
      </div>
    </div>
  );
}

window.MessageRow = MessageRow;
window.TransitIndicator = TransitIndicator;
window.Composer = Composer;
window.routeResponse = routeResponse;

// NETURION — Main app entrypoint


const SEED_SESSIONS = [
  { id: 's1', title: 'Threat-model review',   icon: 'shield',    when: 'Today · 14:02' },
  { id: 's2', title: 'Solidity audit · escrow', icon: 'code',    when: 'Yesterday' },
  { id: 's3', title: 'Q4 launch plan',         icon: 'rocket_launch', when: '2 days ago' },
  { id: 's4', title: 'Personal · interview prep', icon: 'person', when: '4 days ago' },
  { id: 's5', title: 'Whitepaper feedback',    icon: 'description', when: '1 week ago' },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#5dd9ec",
  "palette": "cyan",
  "density": "comfortable",
  "showRail": true,
  "showPrivacy": true,
  "showAtmosphere": true,
  "scanline": true,
  "responseSpeed": 16,
  "mockConnected": false
}/*EDITMODE-END*/;

const PALETTES = {
  cyan:   { accent: '#5dd9ec', deep: '#2bb6cf', light: '#8ee7f5', name: 'Cyan (brand)' },
  violet: { accent: '#8b5cf6', deep: '#7c3aed', light: '#a78bfa', name: 'Violet' },
  azure:  { accent: '#4a9eff', deep: '#2563eb', light: '#7cb8ff', name: 'Azure' },
  lime:   { accent: '#dce87a', deep: '#c8d96a', light: '#e9f29c', name: 'Lime' },
  magenta:{ accent: '#ec4899', deep: '#db2777', light: '#f9a8d4', name: 'Magenta' },
};

function applyPalette(p) {
  const root = document.documentElement;
  const pal = PALETTES[p] || PALETTES.violet;
  root.style.setProperty('--accent', pal.accent);
  root.style.setProperty('--accent-deep', pal.deep);
  root.style.setProperty('--accent-light', pal.light);
  // alpha variants — recompute from hex
  const h = pal.accent.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  root.style.setProperty('--accent-10',   `rgba(${r},${g},${b},0.10)`);
  root.style.setProperty('--accent-20',   `rgba(${r},${g},${b},0.20)`);
  root.style.setProperty('--accent-30',   `rgba(${r},${g},${b},0.30)`);
  root.style.setProperty('--accent-50',   `rgba(${r},${g},${b},0.50)`);
  root.style.setProperty('--accent-glow', `rgba(${r},${g},${b},0.18)`);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Wallet state
  const [wallet, setWallet] = useState(t.mockConnected ? '0x4a8f29B7c1d8E0a2B3F6c0a1b2c3D4e5f6789abc' : '');
  const [showConnect, setShowConnect] = useState(false);
  const ready = !!wallet;

  // Sessions
  const [sessions, setSessions] = useState(SEED_SESSIONS);
  const [activeId, setActiveId] = useState('s1');

  // Messages per session — start session s1 with a seeded conversation, others empty
  const [messagesBySession, setMessagesBySession] = useState({
    s1: [
      { role: 'user',      content: 'Explain the trust assumptions of conditional decryption in 5 bullets.', ts: Date.now() - 1000 * 60 * 4 },
      { role: 'assistant', content: RESPONSES_CACHE.threat, ts: Date.now() - 1000 * 60 * 3 + 30000 },
    ],
    s2: [],
    s3: [],
    s4: [],
    s5: [],
  });

  const messages = messagesBySession[activeId] || [];

  // Composer
  const [input, setInput] = useState('');
  const [flowState, setFlowState] = useState('idle');
  const [transitDir, setTransitDir] = useState(null); // 'up' | 'down' | null
  const [pendingChunks, setPendingChunks] = useState(null); // streaming
  const [lastTx, setLastTx] = useState('');
  const [realLatency, setRealLatency] = useState(null);

  const scrollRef = useRef(null);
  useEffect(() => {
    // Apply palette on mount + when changed
    applyPalette(t.palette);
  }, [t.palette]);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
    }
  }, [messages, transitDir, pendingChunks]);

  function handleConnect()    { setShowConnect(true); }
  function handleDisconnect() { setWallet(''); setTweak('mockConnected', false); }
  async function completeConnect() {
    try {
      if (!window.ethereum) {
        alert('MetaMask not found. Please install MetaMask.');
        return;
      }
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      const addr = accounts[0];
      // Switch to Base Sepolia
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x14A34' }],
        });
      } catch(switchErr) {
        if (switchErr.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x14A34',
              chainName: 'Base Sepolia',
              nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
              rpcUrls: ['https://sepolia.base.org'],
              blockExplorerUrls: ['https://sepolia-explorer.base.org'],
            }],
          });
        }
      }
      setWallet(addr);
      setTweak('mockConnected', true);
      setShowConnect(false);
    } catch(e) {
      alert('Connection failed: ' + e.message);
    }
  }

  function pickSuggestion(text) { setInput(text); }

  function setMessages(updater) {
    setMessagesBySession(prev => {
      const cur = prev[activeId] || [];
      const next = typeof updater === 'function' ? updater(cur) : updater;
      return { ...prev, [activeId]: next };
    });
  }

  async function send() {
    if (!input.trim() || !ready) return;
    const prompt = input.trim();
    const userMsg = { role: 'user', content: prompt, ts: Date.now() };
    setMessages(p => [...p, userMsg]);
    setInput('');
    // Auto-title session from first message
    setSessions(prev => prev.map(s => {
      if (s.id === activeId && s.title === 'New session') {
        const title = prompt.length > 40 ? prompt.slice(0, 40) + '…' : prompt;
        return { ...s, title };
      }
      return s;
    }));

    // Choreographed encryption flow
    setFlowState('encrypt');
    setTransitDir('up');
    // Start API call immediately in parallel
    const _t0 = Date.now();
    const apiPromise = fetch('/api/infer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt, wallet: wallet || '0x000', session_id: 's_' + Date.now()})
    }).then(r => r.json()).then(d => { setRealLatency(Date.now() - _t0); return d; }).catch(() => null);
    await sleep(400);
    setFlowState('transit');
    setLastTx('0x' + Math.random().toString(16).slice(2, 10) + '\u2026' + Math.random().toString(16).slice(2, 8));
    await sleep(400);
    setFlowState('inference');
    setTransitDir(null);
    let full = '';
    try {
      const data = await apiPromise;
      full = data?.response || routeResponse(prompt);
    } catch(e) {
      full = routeResponse(prompt);
    }
    setFlowState('response');
    setTransitDir('down');
    await sleep(300);
    setFlowState('decrypt');
    await sleep(200);
    setPendingChunks(full);
    setTransitDir(null);
    setFlowState('idle');
  }

  // Title of the active session
  const activeSession = sessions.find(s => s.id === activeId) || sessions[0];

  // App grid class toggles
  const appClass = [
    'app',
    t.showRail    ? '' : 'no-rail',
    t.showPrivacy ? '' : 'no-privacy',
  ].filter(Boolean).join(' ');

  return (
    <div className={appClass}>
      {t.showAtmosphere && <Atmosphere />}
      <div className="top-accent-bar"></div>

      <TopBar
        wallet={wallet}
        nodeOk={true}
        onConnect={handleConnect}
        onDisconnect={handleDisconnect}
      />

      {t.showRail && (
        <Rail
          sessions={sessions}
          activeId={activeId}
          onSelect={setActiveId}
          onNew={() => {
            const id = 's' + (sessions.length + 1) + Date.now().toString(36).slice(-4);
            setSessions([{ id, title: 'New session', icon: 'auto_awesome', when: 'just now' }, ...sessions]);
            setActiveId(id);
            setMessagesBySession(prev => ({ ...prev, [id]: [] }));
          }}
        />
      )}

      <main className="main">
        {messages.length === 0 ? (
          <div className="hero">
            <div className="hero-mark-wrap">
              <div className="ring ring-1"></div>
              <div className="ring ring-2"></div>
              <NeturionMark size={96} glow={true} />
            </div>

            <span className="hero-eyebrow">
              <span className="dot"></span>
              Confidential AI · Fairblock Network
            </span>

            <div className="hero-wordmark wordmark" aria-label="NETURION">
              NETUR<span className="target" aria-hidden="true"></span>ION
            </div>

            <h1 className="hero-title">
              Talk to AI like nobody's <span className="accent">listening</span>.
            </h1>

            <p className="hero-sub">
              NETURION runs Llama 3.1 inside a Fairblock-protected node. Your prompts are encrypted with
              your wallet's key before they leave your device — and only you can read what comes back.
            </p>

            <div className="hero-cta-row">
              {!ready ? (
                <button className="btn-primary" onClick={handleConnect}>
                  <span className="material-symbols-outlined">account_balance_wallet</span>
                  Connect wallet to start
                </button>
              ) : (
                <button className="btn-primary" onClick={() => document.querySelector('.composer-input')?.focus()}>
                  <span className="material-symbols-outlined">edit_square</span>
                  Start an encrypted prompt
                </button>
              )}
              <button className="btn-secondary">
                <span className="material-symbols-outlined">menu_book</span>
                How it works
              </button>
            </div>

            <div className="proof-strip" style={{ marginBottom: 24 }}>
              <div className="item"><span className="material-symbols-outlined">lock</span>End-to-end encrypted</div>
              <div className="divider"></div>
              <div className="item"><span className="material-symbols-outlined">memory</span>Self-hosted Llama 3.1</div>
              <div className="divider"></div>
              <div className="item"><span className="material-symbols-outlined">hexagon</span>Fairblock IBE / HE</div>
              <div className="divider"></div>
              <div className="item"><span className="material-symbols-outlined">link</span>Base Sepolia · 84532</div>
            </div>

            {ready && <Suggestions onPick={pickSuggestion} />}
          </div>
        ) : (
          <div className="chat-view">
            <div className="chat-header">
              <div className="chat-title">
                <div className="icon-box">
                  <span className="material-symbols-outlined">{activeSession.icon}</span>
                </div>
                <div className="text">
                  <div className="name">{activeSession.title}</div>
                  <div className="meta">
                    <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}>
                      <span className="material-symbols-outlined" style={{ fontSize:11, color:'var(--accent-light)' }}>lock</span>
                      IBE encrypted
                    </span>
                    <span className="dot"></span>
                    <span>{messages.length} messages</span>
                    <span className="dot"></span>
                    <span style={{ fontFamily:'var(--font-mono)' }}>session · {activeSession.id}</span>
                  </div>
                </div>
              </div>
              <div className="chat-actions">
                <button className="icon-btn" title="Pin"><span className="material-symbols-outlined">push_pin</span></button>
                <button className="icon-btn" title="Verify on-chain"><span className="material-symbols-outlined">verified</span></button>
                <button className="icon-btn" title="Burn session"><span className="material-symbols-outlined">delete_forever</span></button>
                <button className="icon-btn" title="More"><span className="material-symbols-outlined">more_horiz</span></button>
              </div>
            </div>

            <div className="chat-scroll" ref={scrollRef}>
              {t.scanline && <div className="scanline"></div>}
              {messages.map((m, i) => (
                <MessageRow key={i} msg={m} density={t.density} />
              ))}

              {transitDir && <TransitIndicator direction={transitDir} />}

              {pendingChunks !== null && (
                <div className="msg assistant">
                  <div className="msg-avatar"><NeturionMark size={18} /></div>
                  <div className="msg-body">
                    <div className="msg-header">
                      <span className="who">NETURION</span>
                      <span className="lock-tag">
                        <span className="material-symbols-outlined">lock_open</span>
                        Decrypted
                      </span>
                      <span className="ts">streaming</span>
                    </div>
                    <div className="msg-bubble">
                      {renderContent(pendingChunks)}
                      <span className="cursor" style={{
                        display:'inline-block', width:8, height:14,
                        background:'var(--accent-light)', verticalAlign:'-2px',
                        marginLeft:2, animation:'blink 1s steps(2) infinite'
                      }}></span>
                    </div>
                  </div>
                </div>
              )}

              {flowState === 'inference' && pendingChunks === null && (
                <div className="msg assistant">
                  <div className="msg-avatar"><NeturionMark size={18} /></div>
                  <div className="msg-body">
                    <div className="msg-header">
                      <span className="who">NETURION</span>
                      <span className="lock-tag"><span className="material-symbols-outlined">memory</span>Inferring</span>
                    </div>
                    <div className="typing-bubble"><span></span><span></span><span></span></div>
                  </div>
                </div>
              )}
            </div>

            <Composer
              value={input}
              onChange={setInput}
              onSend={send}
              disabled={flowState !== 'idle'}
              ready={ready}
            />
          </div>
        )}

        {messages.length === 0 && (
          <Composer
            value={input}
            onChange={setInput}
            onSend={send}
            disabled={flowState !== 'idle'}
            ready={ready}
          />
        )}
      </main>

      {t.showPrivacy && <PrivacyPanel flowState={flowState} lastTx={lastTx} latency={realLatency} />}

      {showConnect && (
        <ConnectModal
          onClose={() => setShowConnect(false)}
          onConnect={completeConnect}
        />
      )}

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks">
        <TweakSection title="Color">
          <TweakColor
            label="Palette"
            valueKey="palette"
            value={t.palette}
            onChange={setTweak}
            options={[
              ['#5dd9ec', '#8ee7f5', '#2bb6cf'],
              ['#8b5cf6', '#a78bfa', '#7c3aed'],
              ['#4a9eff', '#7cb8ff', '#2563eb'],
              ['#dce87a', '#e9f29c', '#c8d96a'],
              ['#ec4899', '#f9a8d4', '#db2777'],
            ]}
            optionLabels={['Cyan', 'Violet', 'Azure', 'Lime', 'Magenta']}
            onPick={(palette, idx) => {
              const keys = ['cyan','violet','azure','lime','magenta'];
              setTweak('palette', keys[idx]);
            }}
          />
        </TweakSection>

        <TweakSection title="Layout">
          <TweakToggle label="Show session rail"     valueKey="showRail"       value={t.showRail}       onChange={setTweak} />
          <TweakToggle label="Show privacy panel"    valueKey="showPrivacy"    value={t.showPrivacy}    onChange={setTweak} />
          <TweakToggle label="Atmosphere (orbs + grid)" valueKey="showAtmosphere" value={t.showAtmosphere} onChange={setTweak} />
          <TweakToggle label="Scanline overlay"      valueKey="scanline"       value={t.scanline}       onChange={setTweak} />
          <TweakRadio
            label="Message density"
            valueKey="density"
            value={t.density}
            onChange={setTweak}
            options={['compact', 'comfortable', 'cozy']}
          />
        </TweakSection>

        <TweakSection title="Behavior">
          <TweakSlider
            label="Response stream speed (ms/token)"
            valueKey="responseSpeed"
            value={t.responseSpeed}
            min={4}
            max={80}
            step={2}
            onChange={setTweak}
          />
          <TweakToggle label="Mock wallet connected" valueKey="mockConnected" value={t.mockConnected} onChange={(k,v) => {
            setTweak(k, v);
            if (v && !wallet) completeConnect();
            if (!v && wallet) setWallet('');
          }} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// helper
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Stash responses so chat.jsx's RESPONSES can be referenced before its module loads
window.RESPONSES_CACHE = {
  threat: `Five trust assumptions baked into Fairblock's conditional decryption:

1. **Validator quorum honesty.** A threshold (here 2f+1 of 3f+1) of the keeper set must remain non-colluding for the IBE master secret to stay safe.
2. **Network liveness.** Conditional keys are only released after on-chain conditions resolve, so a censoring majority can delay (not break) confidentiality.
3. **Wallet integrity.** Your local signing key is the last line of defense — a compromised wallet means a compromised session.
4. **Time-lock determinism.** Conditions tied to block height assume the underlying chain (Base Sepolia, in NETURION's case) produces blocks at the expected cadence.
5. **Code review of the cApp.** The application surface — NETURION's frontend + node — must be audited; cryptography only protects what the app encrypts.

I'd rate the residual risk: low for casual prompts, medium-low for sensitive code, medium for high-value secrets without additional ZK attestation.`
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
